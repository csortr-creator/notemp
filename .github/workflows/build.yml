name: Build SFAxtnd

on:
  push:
    branches:
      - dev
      - master
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'protocol-tests/provider/**'
      - '.github/workflows/provider-diagnostic.yml'

  workflow_dispatch:
    inputs:
      isolated_aar_only:
        description: 'Build only the experimental composite arm64 AAR'
        required: false
        default: false
        type: boolean
      publish_release:
        description: 'Publish GitHub Release with APKs'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.isolated_aar_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Initialize submodules
        shell: bash
        run: |
          set -euxo pipefail
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git submodule update --init --recursive || true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize submodules after Java
        shell: bash
        run: |
          set -euxo pipefail
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git submodule update --init --recursive || true

      - name: Clone sing-box
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git sing-box-core
          cd sing-box-core
          echo "Sing-box tag/branch:"
          git describe --tags --always || true
          echo "Sing-box commit:"
          git rev-parse HEAD
          echo "Sing-box Go requirement:"
          grep '^go ' go.mod

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box-core/go.mod
          cache: false

      - name: Initialize submodules after Go
        shell: bash
        run: |
          set -euxo pipefail
          git config --global url."https://github.com/".insteadOf "git://github.com/"
          git submodule update --init --recursive || true

      - name: Verify Go version
        shell: bash
        run: |
          set -euxo pipefail
          go version
          cd sing-box-core
          echo "Required Go version:"
          grep '^go ' go.mod

      - name: Set up Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$ANDROID_HOME" -maxdepth 5 -type f 2>/dev/null | head -n 100
            exit 1
          fi

          echo "Found sdkmanager:"
          echo "$SDKMANAGER"

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          export PATH="$SDKMANAGER_DIR:$ANDROID_HOME/platform-tools:$PATH"

          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

          echo "Android SDK and NDK installed."

      - name: Verify build environment
        shell: bash
        run: |
          set -euxo pipefail
          java --version
          go version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          test -d "$ANDROID_HOME"
          test -d "$ANDROID_NDK_HOME"
          ls -lah "$ANDROID_NDK_HOME"

      - name: Install SagerNet gomobile
        shell: bash
        run: |
          set -euxo pipefail
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.13

          export PATH="$(go env GOPATH)/bin:$PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

          gomobile version || true
          gobind -version || true

      - name: Patch source code
        shell: bash
        run: |
          set -euxo pipefail
          SFA_PATCH_TEST_CORE="$PWD/sing-box-core" python3 scripts/test_core_patches.py -v
          ./patch.sh

      - name: Test XHTTP wire compatibility
        timeout-minutes: 15
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --connect-timeout 30 --max-time 120 --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip \
            -o /tmp/xray.zip
          echo '23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae  /tmp/xray.zip' | sha256sum --check
          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip -d /tmp/xray
          cp protocol-tests/xhttp/sfa_pending_close_test.go sing-box-core/transport/v2rayxhttp/
          cp protocol-tests/urltest/*_test.go sing-box-core/common/urltest/
          cd sing-box-core
          XHTTP_XRAY_BINARY=/tmp/xray/xray go test -race -timeout 5m \
            -ldflags=-checklinkname=0 -tags=with_quic,with_utls ./transport/v2rayxhttp ./transport/v2ray ./option ./experimental/libbox ./common/tls ./daemon ./common/urltest ./transport/vlessenc ./protocol/group
          go test -race -timeout 2m -ldflags=-checklinkname=0 -tags=with_quic,with_utls \
            ./transport/v2rayxhttp -run '^TestTransportResourceCleanup$' -count=100

      - name: Test Reality with legacy and current Xray
        timeout-minutes: 10
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --connect-timeout 30 --max-time 120 --retry 3 \
            https://github.com/XTLS/Xray-core/releases/download/v26.9.9/Xray-linux-64.zip \
            -o /tmp/xray-modern.zip
          echo '1eb9175d0f0a8f8149c9230a7fc5ae66ce332ed20a53155ce61fe62e3f58b7df  /tmp/xray-modern.zip' | sha256sum --check
          mkdir -p /tmp/xray-modern
          unzip -q /tmp/xray-modern.zip -d /tmp/xray-modern
          cp protocol-tests/reality/*_test.go sing-box-core/common/tls/
          cp protocol-tests/xhttp/*_test.go sing-box-core/transport/v2rayxhttp/
          cd sing-box-core
          export XHTTP_XRAY_BINARY=/tmp/xray/xray
          export SFA_REALITY_XRAY_BINARY=/tmp/xray-modern/xray
          cp ../protocol-tests/finalmask/*_test.go protocol/vless/
          go test -race -timeout 2m -ldflags=-checklinkname=0 -tags=with_quic,with_utls \
            ./transport/v2rayxhttp -run '^TestSFAXHTTP(PendingResponseClose|ResponseArrivesAfterClose|CancelBeforeConnection|ConcurrentResponseClose)$' -count=10 -v
          go test -race -timeout 2m -ldflags=-checklinkname=0 -tags=with_quic,with_utls \
            ./protocol/vless -run '^TestSFA(Salamander|TCPHeader)' -count=3 -v
          go test -race -timeout 2m -ldflags=-checklinkname=0 -tags=with_quic,with_utls \
            ./common/tls -run '^TestSFAReality(XrayInterop|HybridOptionInterop|HybridClientHello|MinimumVersionInterop|ConfiguredClock|ConfiguredALPN)$' -count=3 -v
          go test -race -timeout 2m -ldflags=-checklinkname=0 -tags=with_quic,with_utls \
            ./transport/v2rayxhttp -run '^TestSFA(PanelRealityXHTTP|XHTTPVirtualHost)$' -count=2 -v
          XHTTP_XRAY_BINARY=/tmp/xray-modern/xray go test -race -timeout 2m -ldflags=-checklinkname=0 -tags=with_quic,with_utls \
            ./transport/v2rayxhttp -run '^TestSFA(PanelRealityXHTTP|XHTTPVirtualHost)$' -count=2 -v
          # sing-vmess Vision uses unsafe reflection incompatible with race checkptr.
          # Keep auth/plain under -race; run the actual Vision HTTPS exchange separately.
          go test -timeout 5m -ldflags=-checklinkname=0 -tags=with_quic,with_utls \
            ./common/tls ./transport/vlessenc -run '^Test(SFAReality(XrayVision|EncryptionVision)|Vision.*_LX)$' -count=3 -v

      - name: Test proxy share-link import
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew -p protocol-tests test --stacktrace

      - name: Validate client DNS fallback and generated settings
        shell: bash
        run: |
          set -euxo pipefail
          cp protocol-tests/sfa_subscription_http_test.go sing-box-core/experimental/libbox/sfa_subscription_http_test.go
          cp protocol-tests/dns_client_fallback_test.go sing-box-core/dns/sfa_client_fallback_test.go
          cd sing-box-core
          go test -race -timeout 3m -ldflags=-checklinkname=0 -tags=with_quic,with_utls ./dns -run TestSFASequentialDNS
          go test -race -timeout 3m ./route/rule -run TestSFARuleSet
          go build -ldflags=-checklinkname=0 -tags=with_quic,with_utls -o /tmp/sfa-config-check ./cmd/sing-box
          for config in ../protocol-tests/build/native-configs/*.json; do
            /tmp/sfa-config-check check -c "$config"
          done
          # B0: harness expect-fail fixtures must be rejected by sing-box check
          if compgen -G "../protocol-tests/build/native-configs-expect-fail/*.json" > /dev/null; then
            for config in ../protocol-tests/build/native-configs-expect-fail/*.json; do
              if /tmp/sfa-config-check check -c "$config"; then
                echo "expected failure but check passed: $config"
                exit 1
              fi
              echo "expect-fail OK (rejected): $config"
            done
          fi

          # B1: dual old/new scaffold compare + in-process CheckConfig bench (timings never fail job)
          cp ../protocol-tests/sfa_node_core_b1_test.go experimental/libbox/sfa_node_core_b1_test.go
          export SFA_B1_COMPARE_DIR="${GITHUB_WORKSPACE}/protocol-tests/build/node-core-compare"
          export SFA_B1_BENCH_CONFIG="${GITHUB_WORKSPACE}/protocol-tests/build/native-configs/harness-vless-reality-domain.json"
          echo "B1 paths:"; ls -la "$SFA_B1_COMPARE_DIR" || true; ls -la "$SFA_B1_BENCH_CONFIG" || true
          # Fallback: protocol-tests may write relative to repo root build/
          if [ ! -d "$SFA_B1_COMPARE_DIR" ] && [ -d "${GITHUB_WORKSPACE}/build/node-core-compare" ]; then
            export SFA_B1_COMPARE_DIR="${GITHUB_WORKSPACE}/build/node-core-compare"
          fi
          if [ ! -f "$SFA_B1_BENCH_CONFIG" ] && [ -f "${GITHUB_WORKSPACE}/build/native-configs/harness-vless-reality-domain.json" ]; then
            export SFA_B1_BENCH_CONFIG="${GITHUB_WORKSPACE}/build/native-configs/harness-vless-reality-domain.json"
          fi
          go test -timeout 10m -ldflags=-checklinkname=0 -tags=with_quic,with_utls ./experimental/libbox -run 'TestSFA(NodeCoreB1|SubscriptionHTTP)' -count=1 -v

          # CLI process overhead sample (logged only; not a pass/fail gate on duration)
          if [ -f "$SFA_B1_BENCH_CONFIG" ]; then
            echo "CLI single check:"
            time /tmp/sfa-config-check check -c "$SFA_B1_BENCH_CONFIG" || true
            echo "CLI x10:"
            time env SFA_B1_BENCH_CONFIG="$SFA_B1_BENCH_CONFIG" bash -c 'for i in $(seq 1 10); do /tmp/sfa-config-check check -c "$SFA_B1_BENCH_CONFIG" || exit 1; done' || true
          fi

      - name: Build libbox
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"

          cd sing-box-core

          echo "Current commit:"
          git rev-parse HEAD

          echo "Building libbox using sing-box internal builder..."

          go run ./cmd/internal/build_libbox -target android

          echo "Build finished."

          ls -lah

          if [ ! -f "libbox.aar" ]; then
            echo "ERROR: libbox.aar was not generated"
            find . -maxdepth 3 -type f \( -name "*.aar" -o -name "*.so" \) -print
            exit 1
          fi

          mkdir -p ../app/libs
          cp libbox.aar ../app/libs/libbox.aar

          cd ..

          echo "Generated libraries:"
          ls -lah app/libs/

          test -f app/libs/libbox.aar

      - name: Read version
        shell: bash
        run: |
          set -euxo pipefail

          # Use version.properties from the repository (do not rewrite from run number)
          if [ ! -f version.properties ]; then
            echo "version.properties missing"
            exit 1
          fi

          VERSION_NAME="$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2- | tr -d '\r')"
          VERSION_CODE="$(grep -E '^VERSION_CODE=' version.properties | cut -d= -f2- | tr -d '\r')"

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "VERSION_NAME/VERSION_CODE empty in version.properties"
            exit 1
          fi

          echo "APP_VERSION=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          echo "Building SFAxtnd version:"
          echo "VERSION_NAME=$VERSION_NAME"
          echo "VERSION_CODE=$VERSION_CODE"

      - name: Setup Release Keystore
        shell: bash
        run: |
          set -euxo pipefail

          echo "Decoding keystore from Base64 (3 parts)..."

          echo -n "${{ secrets.KEYSTORE_BASE64_1 }}${{ secrets.KEYSTORE_BASE64_2 }}${{ secrets.KEYSTORE_BASE64_3 }}" \
            | tr -d '\n\r ' \
            | base64 --decode > app/release.keystore

          echo "Verifying keystore file..."
          ls -lah app/release.keystore
          file app/release.keystore

          echo "Checking keystore is valid..."

          keytool -list \
            -keystore app/release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" || {
              echo "ERROR: keystore is invalid or password is wrong"
              exit 1
            }

          echo "Creating local.properties..."

          cat > local.properties <<EOFPROP
          KEYSTORE_PASS=${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS_NAME=${{ secrets.KEY_ALIAS }}
          ALIAS_PASS=${{ secrets.KEY_PASSWORD }}
          EOFPROP

          echo "local.properties created (values masked):"
          sed 's/=.*/=***/' local.properties

      - name: Build with Gradle
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew assembleOtherDebug -Dorg.gradle.jvmargs="-Xmx4096m -XX:+UseG1GC" --stacktrace

      - name: Prepare and Rename APKs
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p dist

          find app/build/outputs/apk/ -type f -name "*.apk" | while read -r file; do
            filename=$(basename "$file")

            arch=$(echo "$filename" | grep -o -E '(arm64-v8a|armeabi-v7a|x86_64|x86|universal)' || true)

            if [ -n "$arch" ]; then
              cp "$file" "dist/SFAxtnd-${APP_VERSION}-${arch}.apk"
            else
              cp "$file" "dist/SFAxtnd-${APP_VERSION}-universal.apk"
            fi
          done

          echo "Generated APKs:"
          ls -lah dist/

          APK_COUNT="$(find dist -name '*.apk' | wc -l)"

          echo "APK count: $APK_COUNT"

          test "$APK_COUNT" -gt 0

      - name: Upload test APKs
        uses: actions/upload-artifact@v4
        with:
          name: SFAxtnd-${{ github.sha }}
          path: dist/*.apk
          retention-days: 14

      - name: Publish Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.APP_VERSION }}"
          target_commitish: "${{ github.sha }}"
          name: "SFAxtnd v${{ env.APP_VERSION }}"
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  xray-bridge-poc:
    if: github.event_name != 'workflow_dispatch' || inputs.isolated_aar_only != true
    name: Xray wire and composite proof (isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: libbox/xraybridge/go.mod
          cache-dependency-path: |
            libbox/xraybridge/go.sum
            libbox/composite_harness/go.sum
      - name: Test isolated bridge, wire masks and protected dialer
        working-directory: libbox/xraybridge
        env:
          GOTOOLCHAIN: local
        run: go test -race -timeout 2m -count=3 ./...
      - name: Prepare the actual pinned sing-box for composite proof
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git sing-box-core
          test "$(git -C sing-box-core rev-parse HEAD)" = af6e64c3b69e6132ebaee0e1a3d24e93903f6709
          python3 scripts/apply_core_patches.py sing-box-core
      - name: Test both cores in one dependency graph
        working-directory: libbox/composite_harness
        env:
          GOTOOLCHAIN: local
        run: go test -mod=readonly -race -timeout 2m -ldflags=-checklinkname=0 -tags=with_quic,with_utls -count=3 github.com/sagernet/sing-box/xraybridge ./...

  xray-aar-poc:
    name: Isolated composite Android arm64 AAR
    if: github.event_name == 'workflow_dispatch' && inputs.isolated_aar_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: libbox/composite_harness/go.mod
          cache-dependency-path: libbox/composite_harness/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Prepare the actual pinned composite sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git sing-box-core
          test "$(git -C sing-box-core rev-parse HEAD)" = af6e64c3b69e6132ebaee0e1a3d24e93903f6709
          python3 scripts/apply_core_patches.py sing-box-core
      - name: Verify facade and both cores on host
        working-directory: libbox/composite_harness
        run: go test -mod=readonly -race -timeout 2m -ldflags=-checklinkname=0 -tags=with_quic,with_utls -count=3 github.com/sagernet/sing-box/xraybridge ./...
      - name: Install pinned mobile tools
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build isolated arm64 AAR
        working-directory: libbox/composite_harness
        env:
          GOFLAGS: -mod=readonly
        run: |
          set -euxo pipefail
          mkdir -p ../../dist
          gomobile init
          gomobile bind -v -o ../../dist/composite-arm64.aar -target android/arm64 -javapkg io.nekohasekai -androidapi 21 -tags with_quic,with_utls -ldflags=-checklinkname=0 ./native
          git diff --exit-code -- go.mod go.sum
      - name: Verify arm64 JNI and generated Java API
        run: |
          python3 scripts/verify_composite_aar.py dist/composite-arm64.aar dist/composite-aar-check
          javap -classpath dist/composite-aar-check/classes.jar io.nekohasekai.composite.ExecutorFacade io.nekohasekai.composite.Composite
          readelf --dyn-syms --wide dist/composite-aar-check/libgojni.so > dist/composite-aar-check/jni-symbols.txt
          for method in checkSingboxConfig startBridge stopBridge; do
            rg "Java_io_nekohasekai_composite_ExecutorFacade_$method" dist/composite-aar-check/jni-symbols.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: composite-arm64-aar-${{ github.sha }}
          path: |
            dist/composite-arm64.aar
            dist/composite-aar-check/jni-symbols.txt
          if-no-files-found: error
          retention-days: 7
