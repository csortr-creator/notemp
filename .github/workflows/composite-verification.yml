name: Composite verification APK

# Standalone device-gate build: composite arm64 AAR + SFAxtnd-verification-arm64-debug.apk
# Trigger: Actions → Composite verification APK → Run workflow
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray-aar-poc:
    name: Isolated composite Android arm64 AAR
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: libbox/composite_harness/go.mod
          cache-dependency-path: libbox/composite_harness/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Verify experimental network lifecycle before native builds
        run: |
          python3 -m unittest discover -s scripts -p test_prepare_xray_core.py -v
          chmod +x gradlew
          ./gradlew -p protocol-tests test --tests "io.nekohasekai.sfa.bg.BridgeNetworkLifecycleTest" --stacktrace
      - name: Install pinned Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Prepare the actual pinned composite sources
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch v1.14.2 https://github.com/SagerNet/sing-box.git sing-box-core
          test "$(git -C sing-box-core rev-parse HEAD)" = af6e64c3b69e6132ebaee0e1a3d24e93903f6709
          python3 scripts/apply_core_patches.py sing-box-core
          python3 scripts/prepare_xray_core.py
      - name: Verify facade and both cores on host
        working-directory: libbox/composite_harness
        run: go test -mod=readonly -race -timeout 2m -ldflags=-checklinkname=0 -tags=with_quic,with_utls -count=3 github.com/sagernet/sing-box/xraybridge ./
...
